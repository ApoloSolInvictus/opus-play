            { id: 40, title: "Olee", artist: "Apollo & Artemisa", album: "Latino", genre: "latino", mood: "Fiesta spark", color: "#b91c1c", audioUrl: "audio/olee.mp3", coverUrl: "covers/default.jpg", lyricsUrl: "lyrics/default.txt" },
            { id: 41, title: "Reyes del Sol", artist: "Apollo & Artemisa", album: "Latino", genre: "latino", mood: "Solar crown", color: "#c2410c", audioUrl: "audio/reyes-del-sol.mp3", coverUrl: "covers/default.jpg", lyricsUrl: "lyrics/default.txt" },
            { id: 42, title: "Imperio del Amor", artist: "Apollo & Artemisa", album: "Latino", genre: "latino", mood: "Amor imperial", color: "#a21caf", audioUrl: "audio/imperio-del-amor.mp3", coverUrl: "covers/default.jpg", lyricsUrl: "lyrics/default.txt" },
            { id: 43, title: "La Guerra", artist: "Apollo Sol Invictus", album: "Latino", genre: "latino", mood: "Epic latin", color: "#1e3a8a", audioUrl: "audio/la-guerra.mp3", coverUrl: "covers/default.jpg", lyricsUrl: "lyrics/default.txt" },
            { id: 44, title: "Leyenda", artist: "Apollo & Artemisa", album: "Latino", genre: "latino", mood: "Legendary", color: "#312e81", audioUrl: "audio/leyenda.mp3", coverUrl: "covers/default.jpg", lyricsUrl: "lyrics/default.txt" }
        ];

        const GENRE_LIBRARY = [
            { id: "all", name: "Todo aiPod", type: "Coleccion", icon: "ph-stack", color: "#1db954" },
            { id: "electronic", name: "Electronica", type: "Carpeta", icon: "ph-waveform", color: "#3ddbd9" },
            { id: "latino", name: "Latino", type: "Carpeta", icon: "ph-guitar", color: "#f4b942" },
            { id: "muses", name: "The Muses", type: "Carpeta", icon: "ph-sparkle", color: "#b66dff" },
            { id: "pop", name: "Pop Digital", type: "Carpeta", icon: "ph-heart", color: "#ff5c8a" },
            { id: "anthem", name: "Anthems", type: "Carpeta", icon: "ph-flag-banner", color: "#ff7a45" },
            { id: "cosmic", name: "Cosmic", type: "Carpeta", icon: "ph-planet", color: "#5ea0ff" },
            { id: "rock", name: "Rock", type: "Carpeta", icon: "ph-lightning", color: "#ff4f64" },
            { id: "jazz", name: "Jazz", type: "Carpeta", icon: "ph-microphone-stage", color: "#c79a4b" }
        ];

        const STANDARD_TUNING_HZ = 440;
        const AIPOD_TUNING_HZ = 432;
        const RESONANCE_RATE = AIPOD_TUNING_HZ / STANDARD_TUNING_HZ;
        const RESONANCE_RATE_LABEL = RESONANCE_RATE.toFixed(6);
        const SONG_PRICE_USD = "1.77";
        const PAYPAL_CURRENCY = "USD";
        const PAYPAL_SCRIPT_ID = "paypal-js-sdk";

        const apply432HzCalibration = (audio) => {
            if (!audio) return;
            audio.defaultPlaybackRate = RESONANCE_RATE;
            audio.playbackRate = RESONANCE_RATE;
            if ("preservesPitch" in audio) audio.preservesPitch = false;
            if ("mozPreservesPitch" in audio) audio.mozPreservesPitch = false;
            if ("webkitPreservesPitch" in audio) audio.webkitPreservesPitch = false;
        };

        const safeSvgText = (value) => String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");

        const fallbackCover = (track) => {
            const title = safeSvgText(track.title).slice(0, 42);
            const artist = safeSvgText(track.artist).slice(0, 32);
            const color = track.color || "#1db954";
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
                    <defs>
                        <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
                            <stop offset="0" stop-color="${color}"/>
                            <stop offset="1" stop-color="#121212"/>
                        </linearGradient>
                    </defs>
                    <rect width="640" height="640" fill="url(#g)"/>
                    <circle cx="508" cy="126" r="70" fill="rgba(255,255,255,.16)"/>
                    <circle cx="126" cy="492" r="120" fill="rgba(0,0,0,.18)"/>
                    <path d="M227 205v236c0 41-34 74-78 74s-78-28-78-64 35-64 78-64c18 0 34 4 47 12V177l272-58v242c0 41-35 74-78 74s-78-28-78-64 35-64 78-64c18 0 34 4 47 12V169z" fill="rgba(255,255,255,.9)"/>
                    <text x="48" y="566" fill="white" font-family="Inter, Arial" font-size="34" font-weight="800">${title}</text>
                    <text x="48" y="604" fill="rgba(255,255,255,.74)" font-family="Inter, Arial" font-size="22" font-weight="600">${artist}</text>
                </svg>`;
            return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
        };

        const coverSrc = (track) => {
            if (!track?.coverUrl || track.coverUrl.includes("default.jpg")) return fallbackCover(track);
            return track.coverUrl;
        };

        const getSavedLikes = () => {
            try {
                return JSON.parse(localStorage.getItem("aipod-liked-tracks") || "[]");
            } catch {
                return [];
            }
        };

        const formatTime = (time) => {
            if (!Number.isFinite(time) || time < 0) return "0:00";
            const mins = Math.floor(time / 60);
            const secs = Math.floor(time % 60);
            return `${mins}:${secs < 10 ? "0" : ""}${secs}`;
        };

        const getFileType = (track) => {
            const match = track.audioUrl.match(/\.([a-z0-9]+)$/i);
            return match ? match[1].toUpperCase() : "AUDIO";
        };

        const useImageFallback = () => {
            return (track) => (event) => {
                if (event.currentTarget.dataset.fallbackApplied) return;
                event.currentTarget.dataset.fallbackApplied = "true";
                event.currentTarget.src = fallbackCover(track);
            };
        };

        const loadPayPalSdk = ({ clientId, currency }) => {
            return new Promise((resolve, reject) => {
                if (!clientId) {
                    reject(new Error("PayPal client ID no configurado"));
                    return;
                }

                if (window.paypal && window.__aipodPayPalClientId === clientId && window.__aipodPayPalCurrency === currency) {
                    resolve(window.paypal);
                    return;
                }

                const existingScript = document.getElementById(PAYPAL_SCRIPT_ID);
                if (existingScript) existingScript.remove();

                const script = document.createElement("script");
                script.id = PAYPAL_SCRIPT_ID;
                script.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(clientId)}&currency=${encodeURIComponent(currency)}&intent=capture&components=buttons`;
                script.async = true;
                script.onload = () => {
                    window.__aipodPayPalClientId = clientId;
                    window.__aipodPayPalCurrency = currency;
                    resolve(window.paypal);
                };
                script.onerror = () => reject(new Error("No se pudo cargar PayPal"));
                document.head.appendChild(script);
            });
        };

        const App = () => {
            const audioRef = useRef(null);
            const paypalContainerRef = useRef(null);
            const paypalButtonsRef = useRef(null);
            const makeFallback = useImageFallback();

            const [currentSongId, setCurrentSongId] = useState(MASTER_PLAYLIST[0].id);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const [volume, setVolume] = useState(0.88);
            const [muted, setMuted] = useState(false);
            const [searchTerm, setSearchTerm] = useState("");
            const [activeCollection, setActiveCollection] = useState("all");
            const [showLyrics, setShowLyrics] = useState(false);
            const [audioError, setAudioError] = useState(false);
            const [isShuffle, setIsShuffle] = useState(false);
            const [repeatMode, setRepeatMode] = useState("off");
            const [likedIds, setLikedIds] = useState(getSavedLikes);
            const [parsedLyrics, setParsedLyrics] = useState([]);
            const [isLoadingLyrics, setIsLoadingLyrics] = useState(false);
            const [knownDurations, setKnownDurations] = useState({});
            const [purchaseTrack, setPurchaseTrack] = useState(null);
            const [checkoutState, setCheckoutState] = useState({
                status: "idle",
                message: "",
                orderId: ""
            });

            const songData = useMemo(
                () => MASTER_PLAYLIST.find((track) => track.id === currentSongId) || MASTER_PLAYLIST[0],
                [currentSongId]
            );

            const likedSet = useMemo(() => new Set(likedIds), [likedIds]);

            const genreCounts = useMemo(() => {
                return MASTER_PLAYLIST.reduce((acc, track) => {
                    acc[track.genre] = (acc[track.genre] || 0) + 1;
                    return acc;
                }, {});
            }, []);

            const collectionDefinition = useMemo(() => {
                if (activeCollection === "liked") {
                    return { id: "liked", name: "Favoritas", type: "Biblioteca", icon: "ph-heart", color: "#1db954" };
                }
                return GENRE_LIBRARY.find((genre) => genre.id === activeCollection) || GENRE_LIBRARY[0];
            }, [activeCollection]);

            const collectionTracks = useMemo(() => {
                if (activeCollection === "liked") {
                    return MASTER_PLAYLIST.filter((track) => likedSet.has(track.id));
                }
                if (activeCollection === "all") return MASTER_PLAYLIST;
                return MASTER_PLAYLIST.filter((track) => track.genre === activeCollection);
            }, [activeCollection, likedSet]);

            const filteredTracks = useMemo(() => {
                const query = searchTerm.trim().toLowerCase();
                if (!query) return collectionTracks;
                return collectionTracks.filter((track) => {
                    return [track.title, track.artist, track.album, track.genre, track.mood]
                        .join(" ")
                        .toLowerCase()
                        .includes(query);
                });
            }, [collectionTracks, searchTerm]);

            const playbackQueue = filteredTracks.length ? filteredTracks : MASTER_PLAYLIST;
            const queueIndex = playbackQueue.findIndex((track) => track.id === songData.id);
            const currentGenre = GENRE_LIBRARY.find((genre) => genre.id === songData.genre);
            const heroColor = collectionDefinition.color || songData.color;
            const progressValue = duration ? Math.min((currentTime / duration) * 100, 100) : 0;
            const volumeValue = muted ? 0 : volume * 100;

            useEffect(() => {
                try {
                    localStorage.setItem("aipod-liked-tracks", JSON.stringify(likedIds));
                } catch {}
            }, [likedIds]);

            useEffect(() => {
                if (audioRef.current) {
                    apply432HzCalibration(audioRef.current);
                    audioRef.current.volume = muted ? 0 : volume;
                }
            }, [volume, muted]);

            useEffect(() => {
                if (!purchaseTrack) return;

                let cancelled = false;
                setCheckoutState({
                    status: "loading",
                    message: "Conectando el checkout seguro de PayPal...",
                    orderId: ""
                });

                const setupCheckout = async () => {
                    try {
                        const configResponse = await fetch("/api/paypal/config", { cache: "no-store" });
                        if (!configResponse.ok) throw new Error("API PayPal no disponible");

                        const config = await configResponse.json();
                        if (!config.configured || !config.clientId) {
                            if (!cancelled) {
                                setCheckoutState({
                                    status: "setup",
                                    message: "PayPal queda activo al configurar las variables en Vercel.",
                                    orderId: ""
                                });
                            }
                            return;
                        }

                        const paypal = await loadPayPalSdk(config);
                        if (cancelled || !paypalContainerRef.current) return;

                        paypalContainerRef.current.innerHTML = "";
                        const buttons = paypal.Buttons({
                            style: {
                                color: "gold",
                                label: "pay",
                                layout: "vertical",
                                shape: "pill"
                            },
                            createOrder: async () => {
                                setCheckoutState({
                                    status: "processing",
                                    message: "Creando orden segura...",
                                    orderId: ""
                                });

                                const response = await fetch("/api/paypal/create-order", {
                                    method: "POST",
                                    headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({
                                        trackId: purchaseTrack.id,
                                        title: purchaseTrack.title,
                                        artist: purchaseTrack.artist
                                    })
                                });

                                const data = await response.json();
                                if (!response.ok || !data.id) {
                                    throw new Error(data.error || "No se pudo crear la orden.");
                                }

                                return data.id;
                            },
                            onApprove: async (data) => {
                                setCheckoutState({
                                    status: "processing",
                                    message: "Confirmando pago con PayPal...",
                                    orderId: data.orderID || ""
                                });

                                const response = await fetch("/api/paypal/capture-order", {
                                    method: "POST",
                                    headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({ orderID: data.orderID })
                                });

                                const result = await response.json();
                                if (!response.ok) {
                                    throw new Error(result.error || "No se pudo capturar el pago.");
                                }

                                setCheckoutState({
                                    status: "paid",
                                    message: "Pago aprobado. Gracias por apoyar esta musica.",
                                    orderId: result.id || data.orderID || ""
                                });
                            },
                            onCancel: () => {
                                setCheckoutState({
                                    status: "ready",
                                    message: "Pago cancelado. Puedes intentarlo de nuevo cuando quieras.",
                                    orderId: ""
                                });
                            },
                            onError: (error) => {
                                setCheckoutState({
                                    status: "error",
                                    message: error?.message || "PayPal no pudo completar el checkout.",
                                    orderId: ""
                                });
                            }
                        });

                        paypalButtonsRef.current = buttons;
                        await buttons.render(paypalContainerRef.current);
                        if (!cancelled) {
                            setCheckoutState({
                                status: "ready",
                                message: "Checkout PayPal listo.",
                                orderId: ""
                            });
                        }
                    } catch (error) {
                        if (!cancelled) {
                            setCheckoutState({
                                status: "error",
                                message: error.message || "No se pudo iniciar PayPal.",
                                orderId: ""
                            });
                        }
                    }
                };

                setupCheckout();

                return () => {
                    cancelled = true;
                    try {
                        paypalButtonsRef.current?.close?.();
                    } catch {}
                    paypalButtonsRef.current = null;
                };
            }, [purchaseTrack?.id]);

            useEffect(() => {
                let isActive = true;
                const loadLyrics = async () => {
                    setParsedLyrics([]);
                    setIsLoadingLyrics(true);
                    try {
                        const response = await fetch(songData.lyricsUrl);
                        if (!response.ok) throw new Error("Lyrics not found");
                        const text = await response.text();
                        const blocks = text.replace(/\r\n/g, "\n").split(/\n{2,}/);
                        const nextLyrics = blocks.map((block) => {
                            const lines = block.split("\n").map((line) => line.trim()).filter(Boolean);
                            if (!lines.length) return null;
                            if (lines.length === 1 && lines[0].toLowerCase() === "lyrics") return null;
                            const type = lines.length > 1 ? lines[0] : "Letra";
                            const body = lines.length > 1 ? lines.slice(1).join("\n") : lines[0];
                            return { type, text: body };
                        }).filter(Boolean);
                        if (isActive) setParsedLyrics(nextLyrics.length ? nextLyrics : [{ type: "aiPod", text: "Letra en preparacion." }]);
                    } catch {
                        if (isActive) setParsedLyrics([{ type: "aiPod", text: "Letra en preparacion.\nLa musica sigue encendida." }]);
                    } finally {
                        if (isActive) setIsLoadingLyrics(false);
                    }
                };
                loadLyrics();
                return () => { isActive = false; };
            }, [songData.id]);

            useEffect(() => {
                setAudioError(false);
                setCurrentTime(0);
                setDuration(knownDurations[songData.id] || 0);
                if (!audioRef.current) return;
                audioRef.current.pause();
                audioRef.current.load();
                apply432HzCalibration(audioRef.current);
                if (isPlaying) {
                    startCalibratedPlayback().catch(() => {
                        setIsPlaying(false);
                        setAudioError(true);
                    });
                }
            }, [songData.id]);

            const startCalibratedPlayback = () => {
                if (!audioRef.current) return Promise.reject(new Error("Audio no disponible"));
                apply432HzCalibration(audioRef.current);
                return audioRef.current.play();
            };

            const playTrack = (track) => {
                setAudioError(false);
                if (track.id === songData.id) {
                    togglePlay();
                    return;
                }
                setCurrentSongId(track.id);
                setIsPlaying(true);
            };

            const togglePlay = () => {
                if (!audioRef.current || audioError) return;
                if (isPlaying) {
                    audioRef.current.pause();
                    setIsPlaying(false);
                    return;
                }
                startCalibratedPlayback().then(() => {
                    setIsPlaying(true);
                }).catch(() => {
                    setAudioError(true);
                    setIsPlaying(false);
                });
            };

            const getRandomTrack = () => {
                if (playbackQueue.length <= 1) return songData;
                const options = playbackQueue.filter((track) => track.id !== songData.id);
                return options[Math.floor(Math.random() * options.length)];
            };

            const nextSong = () => {
                if (repeatMode === "one" && audioRef.current) {
                    audioRef.current.currentTime = 0;
                    startCalibratedPlayback().catch(() => setAudioError(true));
                    return;
                }
                const nextTrack = isShuffle
                    ? getRandomTrack()
                    : playbackQueue[(queueIndex + 1 + playbackQueue.length) % playbackQueue.length];
                setCurrentSongId(nextTrack.id);
                setIsPlaying(true);
            };

            const prevSong = () => {
                if (audioRef.current && audioRef.current.currentTime > 4) {
                    audioRef.current.currentTime = 0;
                    setCurrentTime(0);
                    return;
                }
                const prevTrack = isShuffle
                    ? getRandomTrack()
                    : playbackQueue[(queueIndex - 1 + playbackQueue.length) % playbackQueue.length];
                setCurrentSongId(prevTrack.id);
                setIsPlaying(true);
            };

            const handleEnded = () => {
                if (repeatMode === "one") {
                    audioRef.current.currentTime = 0;
                    startCalibratedPlayback().catch(() => setAudioError(true));
                    return;
                }
                if (repeatMode === "off" && queueIndex === playbackQueue.length - 1 && !isShuffle) {
                    setIsPlaying(false);
                    return;
                }
                nextSong();
            };

            const toggleLike = (trackId) => {
                setLikedIds((prev) => prev.includes(trackId)
                    ? prev.filter((id) => id !== trackId)
                    : [...prev, trackId]
                );
            };

            const cycleRepeat = () => {
                setRepeatMode((mode) => mode === "off" ? "all" : mode === "all" ? "one" : "off");
            };

            const selectCollection = (id) => {
                setActiveCollection(id);
                setShowLyrics(false);
            };

            const openPurchase = (track, event) => {
                if (event) event.stopPropagation();
                setPurchaseTrack(track);
                setCheckoutState({
                    status: "loading",
                    message: "Preparando checkout PayPal...",
                    orderId: ""
                });
            };

            const closePurchase = () => {
                try {
                    paypalButtonsRef.current?.close?.();
                } catch {}
                paypalButtonsRef.current = null;
                setPurchaseTrack(null);
                setCheckoutState({
                    status: "idle",
                    message: "",
                    orderId: ""
                });
            };

            const handleLoadedMetadata = () => {
                const nextDuration = audioRef.current?.duration || 0;
                apply432HzCalibration(audioRef.current);
                setDuration(nextDuration);
                setKnownDurations((prev) => ({ ...prev, [songData.id]: nextDuration }));
            };

            const displayTrackTime = (track) => {
                if (knownDurations[track.id]) return formatTime(knownDurations[track.id]);
                if (track.id === songData.id && duration) return formatTime(duration);
                return getFileType(track);
            };

            const visibleQueue = playbackQueue
                .filter((track) => track.id !== songData.id)
                .slice(0, 7);

            const topGenres = GENRE_LIBRARY.filter((genre) => genre.id !== "all");

            return (
                <div className="app-shell">
                    <audio
                        ref={audioRef}
                        src={songData.audioUrl}
                        preload="none"
                        onTimeUpdate={() => setCurrentTime(audioRef.current?.currentTime || 0)}
                        onLoadedMetadata={handleLoadedMetadata}
                        onEnded={handleEnded}
                        onError={() => {
                            setAudioError(true);
                            setIsPlaying(false);
                        }}
                    />

                    <aside className="sidebar flex flex-col gap-2 bg-black">
                        <section className="rounded-lg bg-spotify-base p-3">
                            <div className="flex items-center gap-3 px-2 py-3">
                                <div className="flex h-10 w-10 items-center justify-center rounded-full bg-spotify-green text-black">
                                    <i className="ph-fill ph-music-notes text-xl"></i>
                                </div>
                                <div className="min-w-0">
                                    <div className="text-lg font-black">aiPod</div>
                                    <div className="text-xs font-semibold text-spotify-text">Invictus Records</div>
                                    <div className="mt-1 inline-flex items-center gap-1 rounded-full bg-invictus-gold/10 px-2 py-0.5 text-[10px] font-black text-invictus-gold">
                                        <i className="ph ph-wave-sine"></i>
                                        432 Hz
                                    </div>
                                </div>
                            </div>
                            <nav className="mt-2 space-y-1">
                                <button onClick={() => selectCollection("all")} className={`flex w-full items-center gap-4 rounded-md px-3 py-2.5 text-left font-bold transition ${activeCollection === "all" ? "bg-white/10 text-white" : "text-spotify-text hover:text-white hover:bg-white/5"}`}>
                                    <i className="ph-fill ph-house text-2xl"></i>
                                    Inicio
                                </button>
                                <button onClick={() => document.getElementById("aipod-search")?.focus()} className="flex w-full items-center gap-4 rounded-md px-3 py-2.5 text-left font-bold text-spotify-text transition hover:bg-white/5 hover:text-white">
                                    <i className="ph ph-magnifying-glass text-2xl"></i>
                                    Buscar
                                </button>
                                <button onClick={() => selectCollection("liked")} className={`flex w-full items-center gap-4 rounded-md px-3 py-2.5 text-left font-bold transition ${activeCollection === "liked" ? "bg-white/10 text-white" : "text-spotify-text hover:text-white hover:bg-white/5"}`}>
                                    <i className="ph-fill ph-heart text-2xl"></i>
                                    Favoritas
                                </button>
                            </nav>
                        </section>

                        <section className="flex min-h-0 flex-1 flex-col rounded-lg bg-spotify-base">
                            <div className="flex items-center justify-between px-4 py-4">
                                <div className="flex items-center gap-3 text-sm font-black text-white">
                                    <i className="ph ph-books text-2xl text-spotify-text"></i>
                                    Tu biblioteca
                                </div>
                                <span className="rounded-full bg-white/10 px-2.5 py-1 text-xs font-bold text-spotify-text">{MASTER_PLAYLIST.length}</span>
                            </div>
                            <div className="min-h-0 flex-1 overflow-y-auto px-2 pb-3">
                                {GENRE_LIBRARY.map((genre) => {
                                    const count = genre.id === "all" ? MASTER_PLAYLIST.length : genreCounts[genre.id] || 0;
                                    return (
                                        <button
                                            key={genre.id}
                                            onClick={() => selectCollection(genre.id)}
                                            className={`mb-1 flex w-full items-center gap-3 rounded-md p-2 text-left transition ${activeCollection === genre.id ? "bg-white/10 text-white" : "hover:bg-white/5 text-spotify-text"}`}
                                        >
                                            <div className="flex h-12 w-12 shrink-0 items-center justify-center rounded" style={{ background: `linear-gradient(135deg, ${genre.color}, #1f1f1f)` }}>
                                                <i className={`ph ${genre.icon} text-xl text-white`}></i>
                                            </div>
                                            <div className="min-w-0">
                                                <div className="truncate text-sm font-bold text-white">{genre.name}</div>

                            </button>
                            <button onClick={() => setMuted((value) => !value)} className="text-spotify-text transition hover:text-white" title={muted ? "Activar sonido" : "Silenciar"}>
                                <i className={`ph ${muted || volume === 0 ? "ph-speaker-slash" : volume > 0.55 ? "ph-speaker-high" : "ph-speaker-low"} text-xl`}></i>
                            </button>
                            <input
                                className="range w-28"
                                style={{ "--value": `${volumeValue}%` }}
                                type="range"
                                min="0"
                                max="1"
                                step="0.01"
                                value={muted ? 0 : volume}
                                onChange={(event) => {
                                    const nextVolume = Number(event.target.value);
                                    setVolume(nextVolume);
                                    setMuted(nextVolume === 0);
                                }}
                                aria-label="Volumen"
                            />
                        </div>
                    </footer>

                    {purchaseTrack && (
                        <div className="fixed inset-0 z-[80] flex items-center justify-center bg-black/75 px-4 backdrop-blur-sm" onClick={closePurchase}>
                            <section className="w-full max-w-[460px] rounded-lg border border-white/10 bg-spotify-panel p-5 shadow-2xl" onClick={(event) => event.stopPropagation()}>
                                <div className="mb-5 flex items-start justify-between gap-4">
                                    <div className="flex min-w-0 items-center gap-3">
                                        <img src={coverSrc(purchaseTrack)} onError={makeFallback(purchaseTrack)} alt={purchaseTrack.title} className="h-16 w-16 shrink-0 rounded object-cover bg-black" />
                                        <div className="min-w-0">
                                            <div className="text-xs font-black uppercase text-invictus-gold">Compra digital</div>
                                            <h2 className="truncate text-xl font-black text-white">{purchaseTrack.title}</h2>
                                            <p className="truncate text-sm font-semibold text-spotify-text">{purchaseTrack.artist}</p>
                                        </div>
                                    </div>
                                    <button onClick={closePurchase} className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-white/10 text-white transition hover:bg-white/20" title="Cerrar">
                                        <i className="ph ph-x text-lg"></i>
                                    </button>
                                </div>

                                <div className="mb-4 flex items-center justify-between rounded-lg bg-white/5 p-4">
                                    <div>
                                        <div className="text-sm font-black text-white">Cancion individual</div>
                                        <div className="text-xs font-semibold text-spotify-text">MP3/WAV en aiPod 432Hz</div>
                                    </div>
                                    <div className="text-2xl font-black text-invictus-gold">${SONG_PRICE_USD}</div>
                                </div>

                                {checkoutState.message && (
                                    <div className={`mb-4 rounded-lg p-3 text-sm font-semibold ${checkoutState.status === "error" ? "bg-red-950/50 text-red-100" : checkoutState.status === "paid" ? "bg-spotify-green/15 text-spotify-green" : "bg-white/5 text-spotify-text"}`}>
                                        {checkoutState.message}
                                    </div>
                                )}

                                {checkoutState.status === "paid" ? (
                                    <div className="space-y-3">
                                        <a href={purchaseTrack.audioUrl} download className="flex w-full items-center justify-center gap-2 rounded-full bg-spotify-green px-4 py-3 text-sm font-black text-black transition hover:scale-[1.02]">
                                            <i className="ph ph-download-simple text-lg"></i>
                                            Descargar cancion
                                        </a>
                                        {checkoutState.orderId && <div className="text-center text-xs text-spotify-muted">Orden PayPal: {checkoutState.orderId}</div>}
                                    </div>
                                ) : (
                                    <>
                                        <div ref={paypalContainerRef} className="min-h-[48px]"></div>
                                        {(checkoutState.status === "setup" || checkoutState.status === "error") && (
                                            <div className="mt-4 rounded-lg border border-invictus-gold/30 bg-invictus-gold/10 p-4 text-xs font-semibold leading-relaxed text-white/80">
                                                En Vercel configura <span className="font-black text-invictus-gold">PAYPAL_CLIENT_ID</span>, <span className="font-black text-invictus-gold">PAYPAL_CLIENT_SECRET</span> y <span className="font-black text-invictus-gold">PAYPAL_ENV</span>. El precio del servidor queda fijo en ${SONG_PRICE_USD}.
                                            </div>
                                        )}
                                    </>
                                )}
                            </section>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
